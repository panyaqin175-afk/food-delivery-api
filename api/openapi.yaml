openapi: 3.1.0
info:
  title: Food Delivery Orders API
  version: 0.1.0
  summary: Place food orders and track their delivery status.
  description: |
    Customer-facing API of the Orders service of a food-delivery platform.
    Customers place orders, change or cancel them before a courier picks them up,
    and follow the order status.

    **Architecture decisions:** see `docs/adr/0002-use-rabbitmq-between-orders-and-delivery.md`.
    Orders and Delivery communicate asynchronously through RabbitMQ (ADR-0002), so:
    - `POST /orders` returns as soon as the order is saved; the order starts with status `placed`
      and a courier is assigned later.
    - Status changes arrive from Delivery as events and are exposed through
      `GET /orders/{orderId}/status-history`.
  contact:
    name: Team VetCare
    email: team-vetcare@example.edu
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://api.example.edu/v1
    description: Example server
security:
  - bearerAuth: []
tags:
  - name: Orders
    description: Create, read, change and cancel orders.
  - name: Order status
    description: Status history of an order, filled by events from the Delivery service.

paths:
  /orders:
    get:
      tags: [Orders]
      summary: List the customer's orders
      description: Returns the orders of the logged-in customer, newest first, with limit/offset pagination.
      operationId: listOrders
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: status
          in: query
          description: Return only orders with this status.
          required: false
          schema:
            $ref: '#/components/schemas/OrderStatus'
      responses:
        '200':
          description: A page of orders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
              examples:
                onePage:
                  $ref: '#/components/examples/OrderPageExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Orders]
      summary: Place a new order
      description: |
        Saves the order and publishes an `order.placed` message for the Delivery service (ADR-0002).
        The response does not wait for a courier; the order starts with status `placed`.
      operationId: createOrder
      parameters:
        - name: Idempotency-Key
          in: header
          description: Unique key chosen by the client so that a retried request does not create a second order.
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewOrder'
            examples:
              twoItems:
                $ref: '#/components/examples/NewOrderExample'
      responses:
        '201':
          description: Order created.
          headers:
            Location:
              description: URL of the new order.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              examples:
                placed:
                  $ref: '#/components/examples/OrderExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [Orders]
      summary: Get one order
      description: Returns the order with its current status. Clients poll this endpoint to see when a courier is assigned.
      operationId: getOrder
      responses:
        '200':
          description: The order with its current status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              examples:
                placed:
                  $ref: '#/components/examples/OrderExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Orders]
      summary: Change the delivery address or note of an order
      description: Allowed only while the order has status `placed` or `courier_assigned`.
      operationId: updateOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderUpdate'
            examples:
              newNote:
                $ref: '#/components/examples/OrderUpdateExample'
      responses:
        '200':
          description: The updated order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [Orders]
      summary: Cancel an order
      description: |
        Cancels the order and publishes an `order.cancelled` message for Delivery.
        Not possible after the courier has picked up the food.
      operationId: cancelOrder
      responses:
        '204':
          description: Order cancelled.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /orders/{orderId}/status-history:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [Order status]
      summary: List all status changes of an order
      description: |
        Status changes are written when `delivery.status_changed` events arrive from the
        Delivery service (ADR-0002). The newest entry is the current status.
      operationId: listOrderStatusHistory
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Status changes, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusEventPage'
              examples:
                onTheWay:
                  $ref: '#/components/examples/StatusHistoryExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders/{orderId}/status:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [Order status]
      summary: Get the current status of an order (deprecated)
      description: |
        **Deprecated.** Use `GET /orders/{orderId}/status-history?limit=1` instead; it returns the
        current status together with its time and source event. This operation will be removed in version 1.0.0.
      operationId: getOrderStatus
      deprecated: true
      responses:
        '200':
          description: The current status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Limit:
      name: limit
      in: query
      description: Maximum number of items to return.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      description: Number of items to skip.
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    OrderId:
      name: orderId
      in: path
      description: ID of the order.
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    OrderStatus:
      type: string
      description: Order life cycle. `placed` means saved but not yet seen by Delivery.
      enum: [placed, courier_assigned, picked_up, delivered, cancelled]

    Address:
      type: object
      required: [street, city]
      properties:
        street:
          type: string
          maxLength: 200
        city:
          type: string
          maxLength: 100
        apartment:
          type: string
          maxLength: 20
      additionalProperties: false

    NewOrderItem:
      type: object
      required: [menuItemId, quantity]
      properties:
        menuItemId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          maximum: 20
      additionalProperties: false

    OrderItem:
      type: object
      required: [menuItemId, quantity, name, unitPrice]
      properties:
        menuItemId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          maximum: 20
        name:
          type: string
          maxLength: 100
        unitPrice:
          type: number
          minimum: 0
          description: Price of one item in KZT.

    NewOrder:
      type: object
      required: [restaurantId, items, deliveryAddress]
      properties:
        restaurantId:
          type: string
          format: uuid
        items:
          type: array
          minItems: 1
          maxItems: 30
          items:
            $ref: '#/components/schemas/NewOrderItem'
        deliveryAddress:
          $ref: '#/components/schemas/Address'
        note:
          type: string
          maxLength: 300
      additionalProperties: false

    OrderUpdate:
      type: object
      minProperties: 1
      properties:
        deliveryAddress:
          $ref: '#/components/schemas/Address'
        note:
          type: string
          maxLength: 300
      additionalProperties: false

    Order:
      type: object
      required: [id, restaurantId, items, deliveryAddress, status, total, createdAt]
      properties:
        id:
          type: string
          format: uuid
        restaurantId:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        deliveryAddress:
          $ref: '#/components/schemas/Address'
        note:
          type: string
          maxLength: 300
        status:
          $ref: '#/components/schemas/OrderStatus'
        courierName:
          type: [string, 'null']
          description: Empty until Delivery assigns a courier.
        total:
          type: number
          minimum: 0
        createdAt:
          type: string
          format: date-time

    OrderPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        total:
          type: integer
          minimum: 0

    StatusEvent:
      type: object
      required: [eventId, status, occurredAt, source]
      properties:
        eventId:
          type: string
          format: uuid
          description: ID of the message that caused the change; used to ignore duplicate messages.
        status:
          $ref: '#/components/schemas/OrderStatus'
        occurredAt:
          type: string
          format: date-time
        source:
          type: string
          enum: [orders, delivery]

    StatusEventPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StatusEvent'
        total:
          type: integer
          minimum: 0

    Problem:
      type: object
      description: Error format for the whole API (RFC 9457 Problem Details).
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference

  responses:
    BadRequest:
      description: The request is malformed (for example a wrong query parameter).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid access token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The order does not exist or belongs to another customer.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: |
        The request conflicts with the order state, for example cancelling an order that was
        already picked up, or reusing an Idempotency-Key with a different body.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            alreadyPickedUp:
              $ref: '#/components/examples/ConflictExample'
    UnprocessableEntity:
      description: The body is valid JSON but breaks a business rule (for example the restaurant is closed).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  examples:
    NewOrderExample:
      summary: Two pizzas and a drink
      value:
        restaurantId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        items:
          - menuItemId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
            quantity: 2
          - menuItemId: 9b2d1c8e-1f3a-4b6c-8d2e-5a7b9c0d1e2f
            quantity: 1
        deliveryAddress:
          street: Abay Ave 52
          city: Almaty
          apartment: '14'
        note: Please call when you arrive.
    OrderExample:
      summary: Order just placed – no courier yet
      value:
        id: 1b4e28ba-2fa1-11d2-883f-0016d3cca427
        restaurantId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        items:
          - menuItemId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
            quantity: 2
            name: Margherita pizza
            unitPrice: 3200
          - menuItemId: 9b2d1c8e-1f3a-4b6c-8d2e-5a7b9c0d1e2f
            quantity: 1
            name: Lemonade
            unitPrice: 900
        deliveryAddress:
          street: Abay Ave 52
          city: Almaty
          apartment: '14'
        note: Please call when you arrive.
        status: placed
        courierName: null
        total: 7300
        createdAt: '2026-11-17T12:05:00Z'
    OrderPageExample:
      summary: First page with one order
      value:
        items:
          - id: 1b4e28ba-2fa1-11d2-883f-0016d3cca427
            restaurantId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
            items:
              - menuItemId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                quantity: 2
                name: Margherita pizza
                unitPrice: 3200
            deliveryAddress:
              street: Abay Ave 52
              city: Almaty
            status: courier_assigned
            courierName: Arman
            total: 6400
            createdAt: '2026-11-17T12:05:00Z'
        total: 1
    OrderUpdateExample:
      summary: Change the note
      value:
        note: Leave the order at the door.
    StatusHistoryExample:
      summary: Courier on the way
      value:
        items:
          - eventId: 5d8f2a9c-6b1e-4c3d-9a7f-2e4b6c8d0a1b
            status: picked_up
            occurredAt: '2026-11-17T12:31:10Z'
            source: delivery
          - eventId: a1c3e5f7-0b2d-4f6a-8c9e-1d3f5a7b9c0e
            status: courier_assigned
            occurredAt: '2026-11-17T12:06:02Z'
            source: delivery
          - eventId: 0f1e2d3c-4b5a-4968-8776-655443322110
            status: placed
            occurredAt: '2026-11-17T12:05:00Z'
            source: orders
        total: 3
    ConflictExample:
      summary: Order already picked up
      value:
        type: https://api.example.edu/problems/order-already-picked-up
        title: Order can no longer be cancelled
        status: 409
        detail: The courier picked up order 1b4e28ba-2fa1-11d2-883f-0016d3cca427 at 12:31.
        instance: /orders/1b4e28ba-2fa1-11d2-883f-0016d3cca427
