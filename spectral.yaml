# Spectral rules for this API: the built-in OpenAPI rules plus two team rules.
extends: ["spectral:oas"]
rules:
  # Team rule 1: every operation is protected, so it must document 401.
  operation-must-define-401:
    description: Every operation must document a 401 Unauthorized response.
    severity: error
    given: "$.paths[*][get,post,put,patch,delete].responses"
    then:
      field: "401"
      function: truthy
  # Team rule 2: operationId must be camelCase (listOrders, createOrder, ...).
  operation-id-camel-case:
    description: operationId must be camelCase.
    severity: error
    given: "$.paths[*][get,post,put,patch,delete].operationId"
    then:
      function: pattern
      functionOptions:
        match: "^[a-z][a-zA-Z0-9]*$"
